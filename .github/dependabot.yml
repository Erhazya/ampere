# Weekly update pull requests for the actions of the workflows, the Python packages (uv),
# the dashboard's packages (npm) and the base images of deploy/Dockerfile (docker).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The dashboard runs on Node.js 24: the types of a newer Node would accept functions that
      # do not exist at run time (ADR 019).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Node and Python keep the versions of web/.node-version and .python-version: only
      # new builds of the same tags come through, with their security fixes (ADR 020).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # uv changes by hand, in the Dockerfile, ci.yml and the development account at once.
      - dependency-name: "*astral-sh/uv"
