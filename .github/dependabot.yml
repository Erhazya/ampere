# Weekly updates of the GitHub Actions used by the workflows.
# Add one entry per ecosystem when its manifest lands (uv, npm, gradle, cargo).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
