# Builds the demo's image and checks that a container starts and answers: on every pull
# request, where it also runs with the settings of the online demo (ADR 021), and on every push
# to main, where the image is also published to GHCR under the commit's tag (ADR 020).
# No cache: every build starts from the pinned base images.
name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Same grouping as ci.yml: outdated pull request runs are cancelled, runs on main are not.
  group: image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/erhazya/ampere

jobs:
  check:
    name: Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --file deploy/Dockerfile --tag "$IMAGE:check" .
      - name: Check that a container starts and answers
        run: deploy/smoke-test.sh "$IMAGE:check"
      # The online demo runs with deploy/compose.yaml (ADR 021): read-only file system, no
      # capability, memory and process limits. On the server, the platform sets the variables.
      - name: Check that it also runs with the settings of the online demo
        env:
          DEMO_IMAGE: ${{ env.IMAGE }}:check
          DEMO_PORT: "8101"
        run: |
          if ! docker compose --file deploy/compose.yaml up --detach --wait --wait-timeout 60 ||
            ! curl --fail --silent --show-error http://127.0.0.1:8101/api/healthz; then
            docker compose --file deploy/compose.yaml logs
            exit 1
          fi

  publish:
    name: Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job, on main, may write to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: >-
          docker build --file deploy/Dockerfile
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --tag "$IMAGE:sha-$GITHUB_SHA" .
      - name: Check that a container starts and answers
        run: deploy/smoke-test.sh "$IMAGE:sha-$GITHUB_SHA"
      # sha-<commit> is never replaced, and main never goes back to an older commit.
      - name: Publish to GHCR, under the commit and as main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deploy/publish.sh "$IMAGE"
