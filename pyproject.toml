[project]
name = "ampere"
version = "0.1.0"
description = "A digital twin of a 200-house neighbourhood's energy, fed with real public French data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andy Longrée", email = "128273387+Erhazya@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ampere = "ampere:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), import order (I), likely bugs (B),
# modern syntax (UP), simplifications (SIM) and ruff's own rules (RUF).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
